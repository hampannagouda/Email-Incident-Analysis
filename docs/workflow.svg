<svg viewBox="0 0 1240 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B5FC7"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A96AC"/>
    </marker>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="1240" height="640" fill="#F7F6FA"/>

  <!-- title -->
  <text x="36" y="54" font-size="25" font-weight="700" fill="#26242E">Incident Email Agent — Workflow</text>
  <text x="36" y="78" font-size="13.5" fill="#6E6A7E">Exchange inbox → AI analysis → Teams alerts</text>

  <!-- Claude API -->
  <rect x="480" y="44" width="200" height="58" rx="10" fill="#FFFFFF" stroke="#5B5FC7" stroke-width="1.5"/>
  <text x="580" y="68" font-size="13.5" font-weight="700" fill="#26242E" text-anchor="middle">Anthropic Claude API</text>
  <text x="580" y="88" font-size="11" fill="#6E6A7E" text-anchor="middle">claude-opus-5 · structured output</text>
  <line x1="580" y1="106" x2="580" y2="194" stroke="#5B5FC7" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="592" y="143" font-size="10.5" fill="#6E6A7E">email text ↓</text>
  <text x="592" y="159" font-size="10.5" fill="#6E6A7E">incident JSON ↑</text>

  <!-- mailbox -->
  <rect x="36" y="200" width="180" height="120" rx="12" fill="#FFFFFF" stroke="#D9D5E6" stroke-width="1.5"/>
  <rect x="104" y="222" width="44" height="30" rx="4" fill="none" stroke="#5B5FC7" stroke-width="1.8"/>
  <path d="M104,226 L126,246 L148,226" fill="none" stroke="#5B5FC7" stroke-width="1.8"/>
  <text x="126" y="278" font-size="14.5" font-weight="700" fill="#26242E" text-anchor="middle">Incident mailbox</text>
  <text x="126" y="296" font-size="11" fill="#6E6A7E" text-anchor="middle">Exchange Online / Outlook</text>
  <text x="126" y="312" font-size="11" fill="#6E6A7E" text-anchor="middle">polled for new mail</text>

  <!-- mailbox -> agent -->
  <text x="258" y="238" font-size="10.5" fill="#6E6A7E" text-anchor="middle">Microsoft</text>
  <text x="258" y="252" font-size="10.5" fill="#6E6A7E" text-anchor="middle">Graph API</text>
  <line x1="216" y1="262" x2="294" y2="262" stroke="#5B5FC7" stroke-width="2" marker-end="url(#arr)"/>
  <text x="258" y="282" font-size="10.5" fill="#6E6A7E" text-anchor="middle">OAuth 2.0</text>
  <text x="258" y="296" font-size="10.5" fill="#6E6A7E" text-anchor="middle">MSAL</text>

  <!-- agent container -->
  <rect x="300" y="140" width="560" height="350" rx="14" fill="#FFFFFF" stroke="#5B5FC7" stroke-width="1.5"/>
  <text x="324" y="170" font-size="12" font-weight="600" letter-spacing="2" fill="#5B5FC7">INCIDENT EMAIL AGENT — PYTHON</text>

  <!-- stage 1 -->
  <rect x="324" y="200" width="156" height="118" rx="10" fill="#F4F3FA" stroke="#D9D5E6"/>
  <circle cx="346" cy="224" r="11" fill="#5B5FC7"/>
  <text x="346" y="228.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="364" y="229" font-size="13.5" font-weight="700" fill="#26242E">Poll &amp; filter</text>
  <text x="338" y="256" font-size="11" fill="#4A4757">Graph mail query</text>
  <text x="338" y="274" font-size="11" fill="#4A4757">sender / subject rules</text>
  <text x="338" y="292" font-size="11" fill="#4A4757">skip already-processed</text>
  <line x1="480" y1="259" x2="498" y2="259" stroke="#5B5FC7" stroke-width="2" marker-end="url(#arr)"/>

  <!-- stage 2 -->
  <rect x="502" y="200" width="156" height="118" rx="10" fill="#F4F3FA" stroke="#D9D5E6"/>
  <circle cx="524" cy="224" r="11" fill="#5B5FC7"/>
  <text x="524" y="228.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="542" y="229" font-size="13.5" font-weight="700" fill="#26242E">Analyze (AI)</text>
  <text x="516" y="252" font-size="11" fill="#4A4757">is it an incident?</text>
  <text x="516" y="268" font-size="11" fill="#4A4757">extract # · severity</text>
  <text x="516" y="284" font-size="11" fill="#4A4757">systems · impact</text>
  <text x="516" y="300" font-size="11" fill="#4A4757">regex fallback ready</text>
  <line x1="658" y1="259" x2="676" y2="259" stroke="#5B5FC7" stroke-width="2" marker-end="url(#arr)"/>

  <!-- stage 3 -->
  <rect x="680" y="200" width="156" height="118" rx="10" fill="#F4F3FA" stroke="#D9D5E6"/>
  <circle cx="702" cy="224" r="11" fill="#5B5FC7"/>
  <text x="702" y="228.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="720" y="229" font-size="13.5" font-weight="700" fill="#26242E">Route &amp; post</text>
  <text x="694" y="256" font-size="11" fill="#4A4757">severity → channel</text>
  <text x="694" y="274" font-size="11" fill="#4A4757">build Adaptive Card</text>
  <text x="694" y="292" font-size="11" fill="#4A4757">POST webhook + retry</text>

  <!-- non-incident exit -->
  <line x1="580" y1="318" x2="580" y2="352" stroke="#9A96AC" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrm)"/>
  <rect x="502" y="356" width="156" height="44" rx="8" fill="#F9F8FC" stroke="#D9D5E6" stroke-dasharray="4 3"/>
  <text x="580" y="374" font-size="12" font-weight="700" fill="#4A4757" text-anchor="middle">non-incident</text>
  <text x="580" y="390" font-size="10.5" fill="#6E6A7E" text-anchor="middle">skipped — never posted</text>

  <!-- config + state chips -->
  <line x1="429" y1="518" x2="429" y2="492" stroke="#9A96AC" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrm)"/>
  <rect x="324" y="520" width="210" height="46" rx="8" fill="#FFFFFF" stroke="#D9D5E6" stroke-dasharray="4 3"/>
  <text x="429" y="540" font-size="12.5" font-weight="700" fill="#26242E" text-anchor="middle">config.yaml · .env</text>
  <text x="429" y="557" font-size="11" fill="#6E6A7E" text-anchor="middle">routing · filters · secrets</text>

  <line x1="690" y1="518" x2="690" y2="492" stroke="#9A96AC" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrm)"/>
  <rect x="570" y="520" width="240" height="46" rx="8" fill="#FFFFFF" stroke="#D9D5E6" stroke-dasharray="4 3"/>
  <text x="690" y="540" font-size="12.5" font-weight="700" fill="#26242E" text-anchor="middle">.state/processed.json</text>
  <text x="690" y="557" font-size="11" fill="#6E6A7E" text-anchor="middle">dedup — never post twice</text>

  <!-- agent -> teams fan -->
  <line x1="844" y1="246" x2="940" y2="228" stroke="#5B5FC7" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="844" y1="272" x2="940" y2="366" stroke="#5B5FC7" stroke-width="2" marker-end="url(#arr)"/>
  <text x="900" y="296" font-size="10.5" fill="#6E6A7E" text-anchor="middle">Power Automate</text>
  <text x="900" y="310" font-size="10.5" fill="#6E6A7E" text-anchor="middle">webhook · Adaptive Card</text>

  <!-- teams -->
  <text x="950" y="166" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#6E6A7E">MICROSOFT TEAMS</text>

  <rect x="950" y="176" width="250" height="104" rx="10" fill="#FFFFFF" stroke="#D9D5E6" stroke-width="1.5"/>
  <rect x="950" y="176" width="6" height="104" rx="3" fill="#C4314B"/>
  <text x="974" y="208" font-size="14.5" font-weight="700" fill="#26242E"># major-incidents</text>
  <text x="974" y="230" font-size="11.5" font-weight="700" fill="#C4314B">SEV1 · SEV2</text>
  <text x="974" y="248" font-size="11" fill="#6E6A7E">red / orange incident cards</text>

  <rect x="950" y="316" width="250" height="104" rx="10" fill="#FFFFFF" stroke="#D9D5E6" stroke-width="1.5"/>
  <rect x="950" y="316" width="6" height="104" rx="3" fill="#D18F2E"/>
  <text x="974" y="348" font-size="14.5" font-weight="700" fill="#26242E"># it-ops</text>
  <text x="974" y="370" font-size="11.5" font-weight="700" fill="#8A6A1F">SEV3 · SEV4 · UNKNOWN</text>
  <text x="974" y="388" font-size="11" fill="#6E6A7E">routine incident cards</text>

  <!-- footer -->
  <text x="36" y="608" font-size="11.5" fill="#6E6A7E">Every card carries: incident # · severity · affected systems · description · impact · recommended actions · ticket link</text>
</svg>
